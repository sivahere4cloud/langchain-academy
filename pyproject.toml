[project]
name = "langchain-academy"
version = "0.1.0"
description = "Hands-on work through the LangChain Academy courses on LangChain, LangGraph and LangSmith"
readme = "README.md"
authors = [
    { name = "sivahere4cloud", email = "sivaganeshcloud@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-academy = "langchain_academy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
